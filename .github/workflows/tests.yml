name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['5.6']
        # TODO: Enable as we upgrade
        # php: ['5.6', '7.4', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, zip, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --configuration ./phpunit.xml --bootstrap ./vendor/autoload.php

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: tests/_reports/clover.xml
          fail_ci_if_error: false
